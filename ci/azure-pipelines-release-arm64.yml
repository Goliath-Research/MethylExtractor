# MethylExtractor production release (ARM64 Linux) — tag v* (SemVer e.g. v2026.6.1)
# Publishes methyl-extractor-linux-aarch64 to feed methyl-extractor.
#
# Azure DevOps: New pipeline → MethylExtractor-Release-ARM64 → /ci/azure-pipelines-release-arm64.yml
# Pool: self-hosted build-arm64 (small ARM64 Ubuntu VM; no GPU required)
# If validation fails on the pool, see ci/README.md § "Troubleshooting: build-arm64"

trigger:
  tags:
    include:
      - v*

resources:
  repositories:
    - repository: MethylPipeline
      type: git
      name: Development/MethylPipeline
      ref: main

parameters:
  - name: releaseVersion
    displayName: Release version (manual runs only; e.g. 2026.6.1)
    type: string
    default: ''

variables:
  azureDevOpsProject: Development
  methylExtractorFeed: methyl-extractor
  archKey: aarch64

pool:
  name: build-arm64

steps:
  - checkout: self
    persistCredentials: true
    path: s/$(Build.Repository.Name)

  - checkout: MethylPipeline
    path: s/MethylPipeline

  - bash: |
      set -euo pipefail
      cd "$(Pipeline.Workspace)/s/$(Build.Repository.Name)"
      # Fresh build-arm64 VMs may not have make yet; install deps via apt (same set as `make deps`).
      sudo apt-get update
      sudo apt-get install -y \
        build-essential \
        cmake \
        git \
        libhdf5-dev \
        libhts-dev \
        zlib1g-dev \
        libbz2-dev \
        liblzma-dev \
        libcurl4-gnutls-dev \
        libssl-dev \
        libzstd-dev \
        zstd \
        hdf5-tools
      make
    displayName: Build MethylExtractor

  - bash: |
      set -euo pipefail
      if [[ "${BUILD_SOURCEBRANCH}" == refs/tags/v* ]]; then
        VERSION="${BUILD_SOURCEBRANCHNAME#v}"
      elif [[ -n "${RELEASE_VERSION_PARAM}" ]]; then
        VERSION="${RELEASE_VERSION_PARAM}"
      else
        echo "##[error]Run from a v* tag (e.g. v2026.6.1) or set pipeline parameter releaseVersion for manual runs."
        echo "##[error]Manual runs from main leave BUILD_SOURCEBRANCHNAME=main, which is not a valid package version."
        exit 1
      fi
      ME_ROOT="$(Pipeline.Workspace)/s/$(Build.Repository.Name)"
      PKG="$(Pipeline.Workspace)/s/MethylPipeline/scripts/package_methyl_extractor.sh"
      OUT="$(Build.ArtifactStagingDirectory)/methyl-extractor-linux-$(archKey).tar.gz"
      bash "$PKG" \
        --build-dir "$ME_ROOT" \
        --arch "$(archKey)" \
        --version "$VERSION" \
        --output "$OUT"
      mkdir -p "$(Build.ArtifactStagingDirectory)/universal"
      cp "$OUT" "$(Build.ArtifactStagingDirectory)/universal/"
      sha256sum "$OUT" | tee "$(Build.ArtifactStagingDirectory)/universal/$(archKey).sha256"
      echo "##vso[task.setvariable variable=PackageVersion]$VERSION"
    displayName: Package tarball
    env:
      RELEASE_VERSION_PARAM: ${{ parameters.releaseVersion }}

  - task: PublishPipelineArtifact@1
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)
      artifactName: methyl-extractor-arm64-$(PackageVersion)
    displayName: Publish pipeline artifact

  - task: UniversalPackages@0
    displayName: Publish Universal Package
    inputs:
      command: publish
      publishDirectory: $(Build.ArtifactStagingDirectory)/universal
      feedsToUsePublish: internal
      vstsFeedPublish: $(azureDevOpsProject)/$(methylExtractorFeed)
      vstsFeedPackagePublish: methyl-extractor-linux-$(archKey)
      versionOption: custom
      versionPublish: $(PackageVersion)
      packagePublishDescription: MethylExtractor binary tarball (aarch64)
