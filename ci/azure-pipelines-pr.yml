# MethylExtractor PR validation — x64 build + smoke test (no publish)
#
# ARM64 PR builds require the self-hosted build-arm64 pool (use release ARM64 pipeline
# or add a separate PR pipeline if needed).

trigger: none

pr:
  branches:
    include:
      - main
      - master
      - develop

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  - bash: |
      set -euo pipefail
      make deps
      make
    displayName: Build MethylExtractor

  - bash: |
      set -euo pipefail
      BIN="build/dynamic/x64/MethylExtractor"
      [[ -x "$BIN" ]] || { echo "Missing $BIN"; exit 1; }
      "$BIN" --help 2>/dev/null || "$BIN" -h 2>/dev/null || true
      echo "Smoke OK: $BIN"
    displayName: Smoke test binary
