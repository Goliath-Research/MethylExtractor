# MethylExtractor PR validation — build + smoke test (no publish)

trigger: none

pr:
  branches:
    include:
      - main
      - master
      - develop

parameters:
  - name: architectures
    type: object
    default:
      - arm64
      - x64

stages:
  - ${{ each arch in parameters.architectures }}:
      - stage: build_${{ arch }}
        displayName: PR build ${{ arch }}
        pool:
          ${{ if eq(arch, 'arm64') }}:
            name: GPU-ARM64
          ${{ else }}:
            name: GPU-x86_64
        jobs:
          - job: build
            steps:
              - checkout: self

              - script: make
                displayName: Build MethylExtractor

              - script: |
                  case "${{ arch }}" in
                    arm64) SUB=arm64 ;;
                    *) SUB=x64 ;;
                  esac
                  BIN="build/dynamic/${SUB}/MethylExtractor"
                  [[ -x "$BIN" ]] || { echo "Missing $BIN"; exit 1; }
                  "$BIN" --help 2>/dev/null || "$BIN" -h 2>/dev/null || true
                  echo "Smoke OK: $BIN"
                displayName: Smoke test binary
