name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libhdf5-dev \
            libhts-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libzstd-dev

      - name: Build (dynamic)
        run: |
          make clean
          make dynamic

      - name: Smoke test (--help)
        run: |
          set -euo pipefail
          BIN=$(make -s print-dynamic-bin)
          echo "Built binary: $BIN"
          "$BIN" --help

  pyrefly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Python dependencies
        run: poetry install --no-interaction

      - name: Pyrefly
        run: poetry run pyrefly check
