name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libhdf5-dev \
            libhts-dev \
            zlib1g-dev \
            libbz2-dev \
            liblzma-dev \
            libcurl4-gnutls-dev \
            libssl-dev \
            libzstd-dev

      - name: Build (dynamic)
        run: make dynamic

      - name: Smoke test (--help)
        run: |
          BIN=$(find build -name MethylExtractor -type f | head -n1)
          echo "Built binary: $BIN"
          "$BIN" --help
